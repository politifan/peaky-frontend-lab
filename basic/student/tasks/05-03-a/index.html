<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Практика</title><style></style></head><body><label for="query">Поиск</label><input id="query"><ul id="results"></ul><script>query.oninput=async()=>{const r=await fetch('/api/search?q='+query.value);const data=await r.json();results.innerHTML=data.map(x=>'<li>'+x.name+'</li>').join('')}</script></body></html>
